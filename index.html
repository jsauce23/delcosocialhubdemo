<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DELCO Social Hub — DEMO</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0B1B33; --body:#46586F; --muted:#8494A8; --line:#DDE4EC; --paper:#F3F6FA;
  --surface:#fff; --navy:#0E2647; --navy2:#1B3A66; --gold:#F6A21E; --goldsoft:#FEF3E0;
  --goldink:#96590A; --blue:#1D6FC4; --bluesoft:#E9F1FB; --warm:#C2610A; --warmsoft:#FDF1E2;
  --good:#17845C; --goodsoft:#E8F5EF;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);
  --lift:0 8px 24px rgba(16,24,40,.10);
}
*{box-sizing:border-box;min-width:0}
svg{flex-shrink:0}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden;
  -webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;background:var(--paper);color:var(--ink)}
a{color:inherit}
button{font-family:inherit;cursor:pointer}
.app{display:flex;min-height:100dvh;width:100%}

/* sidebar */
.side{width:248px;flex-shrink:0;background:var(--navy);display:flex;flex-direction:column;
  position:sticky;top:0;height:100dvh}
.side .brand{padding:18px 20px;border-bottom:1px solid rgba(255,255,255,.1);display:flex;gap:10px;align-items:center}
.side .brand img{height:40px;width:auto}
.side .brand b{color:#fff;font-size:13px;display:block;font-weight:600}
.side .brand span{color:var(--gold);font-size:11px;font-weight:700;letter-spacing:.5px}
.nav{flex:1;padding:14px 12px;overflow-y:auto}
.nav button{width:100%;display:flex;align-items:center;gap:12px;padding:10px 12px;border:0;
  background:transparent;color:rgba(255,255,255,.68);font-size:14px;font-weight:500;
  border-radius:8px;border-left:2px solid transparent;text-align:left;margin-bottom:2px}
.nav button:hover{background:rgba(255,255,255,.05);color:#fff}
.nav button.on{background:var(--navy2);color:#fff;border-left-color:var(--gold)}
.nav .badge{margin-left:auto;background:var(--gold);color:var(--navy);font-size:11px;
  font-weight:700;border-radius:99px;padding:1px 7px}
.side .luna{margin:12px;padding:12px;background:var(--navy2);border-radius:10px;border:0;
  text-align:left;color:#fff;display:block;width:calc(100% - 24px)}
.side .luna b{display:flex;gap:8px;align-items:center;font-size:14px}
.side .luna p{margin:6px 0 0;color:rgba(255,255,255,.6);font-size:12px;line-height:1.45}
.side .me{padding:12px 16px;border-top:1px solid rgba(255,255,255,.1);display:flex;gap:10px;align-items:center}
.side .me .av{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.14);
  color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.side .me b{color:#fff;font-size:13px;display:block;font-weight:500}
.side .me span{color:rgba(255,255,255,.5);font-size:11px}

/* main */
.main{flex:1;min-width:0;max-width:100%;display:flex;flex-direction:column}
.demobar{background:var(--navy);border-bottom:2px solid var(--gold);padding:8px 16px;
  display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;text-align:center}
.demobar .tag{background:var(--gold);color:var(--navy);font-size:11px;font-weight:800;
  padding:2px 7px;border-radius:4px;letter-spacing:.5px}
.demobar span{color:#DCE7F5;font-size:12px}
.demobar .v{color:#6E8AAE;font-size:11px}
.top{background:var(--surface);border-bottom:2px solid var(--gold);padding:10px 16px;
  display:flex;gap:10px;align-items:center;position:sticky;top:0;z-index:20}
.searchbox{flex:1;max-width:420px;display:flex;gap:8px;align-items:center;background:var(--paper);
  border:1px solid var(--line);border-radius:8px;padding:8px 12px;color:var(--muted);font-size:13px}
.content{flex:1;padding:24px 16px 48px;max-width:100%}
.wrap{max-width:1280px;margin:0 auto}
.menubtn{display:none;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px}

/* bits */
h1.page{font-size:28px;font-weight:700;letter-spacing:-.5px;margin:0}
p.sub{color:var(--body);margin:6px 0 0;font-size:15px}
h2.sec{font-size:17px;font-weight:600;letter-spacing:-.2px;margin:0}
p.secsub{color:var(--muted);font-size:13px;margin:3px 0 0}
.sechead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;
  flex-wrap:wrap;margin:0 0 14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.card.pad{padding:16px}
.grid{display:grid;gap:12px}
.row{display:flex;gap:12px;align-items:center}
.stat{padding:14px}
.stat .l{font-size:12px;color:var(--muted)}
.stat .v{font-size:24px;font-weight:700;letter-spacing:-.5px;margin-top:4px;font-variant-numeric:tabular-nums}
.stat .n{font-size:11px;color:var(--muted);margin-top:4px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:4px 9px;
  font-size:12px;font-weight:500;white-space:nowrap;background:#F1F3F7;color:var(--body)}
.pill.gold{background:var(--goldsoft);color:var(--goldink)}
.pill.blue{background:var(--bluesoft);color:var(--blue)}
.pill.good{background:var(--goodsoft);color:var(--good)}
.pill.warm{background:var(--warmsoft);color:var(--warm)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:8px;
  font-size:13px;font-weight:600;padding:9px 14px;border:1px solid var(--line);
  background:#fff;color:var(--ink)}
.btn:hover{filter:brightness(.97)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.btn.dark{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.quiet{border-color:transparent;background:transparent;color:var(--body)}
.btn.sm{padding:6px 10px;font-size:12px}
.btn.full{width:100%}
.thumb{border-radius:8px;overflow:hidden;position:relative;display:flex;align-items:center;
  justify-content:center;color:#fff}
.thumb .slash{position:absolute;width:160%;height:60%;background:rgba(255,255,255,.1);
  transform:rotate(-18deg) translateY(30%)}
.muted{color:var(--muted)}
.small{font-size:12px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:transparent;padding:9px 12px;font-size:13px;font-weight:600;
  color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--gold)}
.chip{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;
  font-size:13px;font-weight:500;color:var(--body)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip.round{border-radius:99px;padding:5px 11px;font-size:12px}
.chip.round.on{background:var(--bluesoft);border-color:#BEDBF6;color:var(--blue)}

/* panels */
.scrim{position:fixed;inset:0;background:rgba(11,27,51,.42);z-index:40;display:flex;justify-content:flex-end}
.panel{background:#fff;width:100%;max-width:560px;height:100dvh;overflow-y:auto;overscroll-behavior:contain}
.panel .ph{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);
  padding:16px 20px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;z-index:2}
.panel .pb{padding:20px}
.panel .pf{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);
  padding:12px 20px;display:flex;gap:8px;flex-wrap:wrap}
.iconbtn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px;display:inline-flex}

/* timeline + pipeline */
.track{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.track i{width:8px;height:8px;border-radius:50%;background:var(--line);display:block}
.track i.done{background:var(--good)}
.track i.now{background:var(--gold);outline:3px solid var(--goldsoft)}
.track em{font-style:normal;font-size:11px;color:var(--muted);white-space:nowrap}
.track em.now{color:var(--goldink);font-weight:600}
.track s{width:16px;height:1px;background:var(--line);display:block}
.tl{list-style:none;margin:0;padding:0 0 0 18px;position:relative}
.tl:before{content:"";position:absolute;left:4px;top:6px;bottom:6px;width:1px;background:var(--line)}
.tl li{position:relative;padding-bottom:12px}
.tl li:before{content:"";position:absolute;left:-18px;top:5px;width:9px;height:9px;border-radius:50%;
  background:#fff;border:2px solid var(--line)}
.tl li:last-child:before{background:var(--gold);border-color:var(--gold)}
.tl b{display:block;font-size:13px;font-weight:500}
.tl span{font-size:11px;color:var(--muted)}

/* calendar + board */
.cal{display:grid;grid-template-columns:repeat(7,1fr);min-width:700px}
.cal .hd{padding:10px;font-size:11px;font-weight:700;color:var(--muted);border-bottom:1px solid var(--line)}
.cal .cell{min-height:104px;padding:8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.cal .cell:nth-child(7n){border-right:0}
.cal .d{font-size:11px;font-weight:600;color:var(--body)}
.cal .ev{border-radius:6px;padding:5px 6px;margin-top:5px;font-size:11px;line-height:1.3;
  border-left:3px solid;cursor:pointer}
.scrollx{overflow-x:auto}
.board{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px;max-width:100%}
.col{width:262px;min-width:262px;flex-shrink:0}

/* modal */
.modal{position:fixed;inset:0;background:rgba(11,27,51,.6);z-index:60;display:flex;
  align-items:center;justify-content:center;padding:16px}
.modal .box{background:#fff;border-radius:16px;max-width:520px;width:100%;overflow:hidden;box-shadow:var(--lift)}
.modal .mh{background:var(--navy);padding:18px 22px;display:flex;gap:10px;align-items:center}
.modal .mh h3{color:#fff;margin:0;font-size:17px;font-weight:600}
.modal .mb{padding:20px 22px}
.modal .mb li{font-size:13px;color:var(--body);line-height:1.6;margin-bottom:6px}
.modal .mf{padding:14px 22px;background:#FAFBFC;border-top:1px solid var(--line)}
.footnote{margin-top:36px;padding-top:18px;border-top:1px solid var(--line);text-align:center;
  font-size:12px;color:var(--muted);line-height:1.7}

@media (max-width:1024px){
  .side{position:fixed;left:0;top:0;z-index:50;transform:translateX(-100%);transition:transform .2s}
  .side.open{transform:none}
  .menubtn{display:inline-flex}
  .backdrop{position:fixed;inset:0;background:rgba(11,27,51,.45);z-index:45}
}
</style>
</head>

/* --- shared bits --------------------------------------------------------- */
function statusPill(s) { var x = STATUS[s]; return '<span class="pill ' + x.c + '">' + esc(x.l) + '</span>'; }
function platIcon(p, size) { var x = PLAT[p]; return x ? ic(x.i, size || 13, x.c) : ""; }
function thumb(tone, icon, h, play) {
  return '<div class="thumb" style="background:' + tone + ';height:' + h + 'px">' +
    '<div class="slash"></div>' + ic(icon, 22, "#fff") +
    (play ? '<span style="position:absolute;bottom:6px;left:6px;background:rgba(0,0,0,.45);' +
      'border-radius:5px;padding:1px 5px;font-size:10px">0:24</span>' : '') + '</div>';
}
function track(stage) {
  var h = '<div class="track">';
  for (var i = 0; i < PIPE.length; i++) {
    var cls = i < stage ? "done" : (i === stage ? "now" : "");
    h += '<i class="' + cls + '"></i><em class="' + (i === stage ? "now" : "") + '">' + PIPE[i] + '</em>';
    if (i < PIPE.length - 1) h += '<s></s>';
  }
  return h + '</div>';
}
function timeline(acts) {
  var h = '<ul class="tl">';
  for (var i = 0; i < acts.length; i++) h += '<li><b>' + esc(acts[i].x) + '</b><span>' + esc(acts[i].d) + '</span></li>';
  return h + '</ul>';
}
function sechead(t, s, right) {
  return '<div class="sechead"><div><h2 class="sec">' + esc(t) + '</h2>' +
    (s ? '<p class="secsub">' + esc(s) + '</p>' : '') + '</div>' + (right || "") + '</div>';
}
function fmtDate(iso) {
  var M = ["","Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var p = iso.split("-"); return M[+p[1]] + " " + (+p[2]);
}
function fmtN(n) { return n >= 1000 ? (n / 1000).toFixed(1) + "K" : String(n); }
function byId(id) { for (var i = 0; i < CONTENT.length; i++) if (CONTENT[i].id === id) return CONTENT[i]; return null; }
function reqById(id) { for (var i = 0; i < REQUESTS.length; i++) if (REQUESTS[i].id === id) return REQUESTS[i]; return null; }

/* --- charts, drawn as SVG ------------------------------------------------ */
function axis(max, w, h, pl) {
  var g = "", i, y;
  for (i = 0; i <= 3; i++) {
    y = 10 + ((h - 34) / 3) * i;
    g += '<line x1="' + pl + '" x2="' + (w - 8) + '" y1="' + y + '" y2="' + y +
      '" stroke="' + T.line + '" stroke-dasharray="3 3"/>' +
      '<text x="' + (pl - 6) + '" y="' + (y + 4) + '" text-anchor="end" font-size="10" fill="' +
      T.muted + '">' + Math.round(max * (1 - i / 3)).toLocaleString() + '</text>';
  }
  return g;
}
function xlabels(rows, w, h, pl) {
  var g = "", step = Math.ceil(rows.length / 6), i, x;
  for (i = 0; i < rows.length; i += step) {
    x = pl + ((w - pl - 8) / (rows.length - 1)) * i;
    g += '<text x="' + x + '" y="' + (h - 4) + '" text-anchor="middle" font-size="10" fill="' +
      T.muted + '">' + esc(rows[i][0]) + '</text>';
  }
  return g;
}
function pts(rows, idx, max, w, h, pl) {
  var out = [], i, x, y;
  for (i = 0; i < rows.length; i++) {
    x = pl + ((w - pl - 8) / (rows.length - 1)) * i;
    y = 10 + (h - 34) - (rows[i][idx] / max) * (h - 34);
    out.push(x.toFixed(1) + "," + y.toFixed(1));
  }
  return out.join(" ");
}
function areaChart(rows, h) {
  var w = 620, pl = 42, max = 0, i;
  for (i = 0; i < rows.length; i++) max = Math.max(max, rows[i][1]);
  max = max * 1.1;
  var line = pts(rows, 1, max, w, h, pl);
  var first = line.split(" ")[0].split(",")[0], last = line.split(" ").pop().split(",")[0];
  var base = 10 + (h - 34);
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" style="width:100%;height:auto;display:block">' +
    axis(max, w, h, pl) + xlabels(rows, w, h, pl) +
    '<polygon points="' + line + ' ' + last + ',' + base + ' ' + first + ',' + base +
    '" fill="#E9F1FB"/><polyline points="' + line + '" fill="none" stroke="' + T.blue +
    '" stroke-width="2.5"/></svg>';
}
function lineChart(rows, h) {
  var w = 620, pl = 42, max = 0, i, j;
  for (i = 0; i < rows.length; i++) for (j = 1; j <= 3; j++) max = Math.max(max, rows[i][j]);
  max = max * 1.1;
  var cols = ["#C13584", "#1877F2", "#111"], names = ["Instagram", "Facebook", "TikTok"], g = "", key = "";
  for (j = 1; j <= 3; j++) {
    g += '<polyline points="' + pts(rows, j, max, w, h, pl) + '" fill="none" stroke="' +
      cols[j - 1] + '" stroke-width="2.5"/>';
    key += '<span class="row small" style="gap:6px"><i style="width:12px;height:3px;border-radius:2px;' +
      'background:' + cols[j - 1] + ';display:block"></i>' + names[j - 1] + '</span>';
  }
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" style="width:100%;height:auto;display:block">' +
    axis(max, w, h, pl) + xlabels(rows, w, h, pl) + g + '</svg>' +
    '<div class="row" style="justify-content:center;gap:16px;margin-top:8px;color:' + T.muted + '">' + key + '</div>';
}
function barChart(rows, h) {
  var w = 620, pl = 42, max = 0, i, g = "";
  for (i = 0; i < rows.length; i++) max = Math.max(max, rows[i][1]);
  max = max * 1.15;
  var span = (w - pl - 8) / rows.length, bw = Math.min(48, span * 0.5), base = 10 + (h - 34);
  for (i = 0; i < rows.length; i++) {
    var y = 10 + (h - 34) - (rows[i][1] / max) * (h - 34);
    g += '<rect x="' + (pl + span * i + (span - bw) / 2) + '" y="' + y + '" width="' + bw +
      '" height="' + (base - y) + '" rx="4" fill="' + T.gold + '"/>';
  }
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" style="width:100%;height:auto;display:block">' +
    axis(max, w, h, pl) + xlabels(rows, w, h, pl) + g + '</svg>';
}

function graphicSVG(headline, kicker, bg, centered) {
  var lines = [], words = headline.toUpperCase().split(" "), line = "", max = centered ? 15 : 12;
  for (var i = 0; i < words.length; i++) {
    if ((line + " " + words[i]).replace(/^ /, "").length > max && line) { lines.push(line); line = words[i]; }
    else line = (line + " " + words[i]).replace(/^ /, "");
  }
  if (line) lines.push(line);
  var longest = 0;
  for (i = 0; i < lines.length; i++) longest = Math.max(longest, lines[i].length);
  var fs = Math.min(centered ? 84 : 74, Math.floor((centered ? 900 : 520) / (longest * 0.56)));
  var gap = fs * 1.06, txt = "", y;

    '<button class="btn dark" data-send="1">' + ic("send", 14) + '</button></div></div></div>';
  return h;
}

/* --- shell, state and events --------------------------------------------- */
var state = {
  view: "dashboard", panel: null, panelId: null, tab: "brief", menu: false,
  notice: true, plannerView: (window.innerWidth < 768 ? "List" : "Month"),
  aiType: "graphic", aiPrompt: "", aiState: "idle", aiResult: null, brandLock: true,
  libCat: "All", libTags: [], range: "30 Days",
  luna: [{ r: "ai", x: "Morning. I've got DELCO's calendar, brand, uploads and analytics loaded. What do you need?" }]
};

var NAV = [["dashboard","Dashboard","dashboard",0],["planner","Content Planner","calendar",0],
  ["ai","Create with AI","sparkles",0],["requests","Content Requests","inbox",2],
  ["library","Content Library","images",0],["analytics","Analytics","chart",0],
  ["brand","Brand Hub","palette",0],["settings","Settings","settings",0]];

function sidebar() {
  var h = '<aside class="side' + (state.menu ? ' open' : '') + '">' +
    '<div class="brand"><img src="' + LOGO + '" alt="DELCO Heating and Cooling" ' +
    'onerror="this.style.display=\'none\'"><div><b>Social Hub</b><span>DEMO VERSION</span></div></div><nav class="nav">';
  for (var i = 0; i < NAV.length; i++) {
    h += '<button data-nav="' + NAV[i][0] + '" class="' + (state.view === NAV[i][0] ? "on" : "") + '">' +
      ic(NAV[i][2], 16) + '<span style="flex:1">' + NAV[i][1] + '</span>' +
      (NAV[i][3] ? '<span class="badge">' + NAV[i][3] + '</span>' : '') + '</button>';
  }
  h += '</nav><button class="luna" data-luna="1"><b>' + ic("sparkles", 14, "#fff") + ' Ask LUNA</b>' +
    '<p>What should we post this week?</p></button>' +
    '<div class="me"><span class="av">B</span><div><b>Brian Guthmiller</b><span>Owner</span></div></div></aside>';
  return h;
}

function demoNotice() {
  var pts = ["Every post, photo, request and number is a made-up example.",
    "Nothing is connected to DELCO\u2019s real social accounts.",
    "Nothing you do here posts, sends or changes anything.",
    "The AI studio simulates its results — it isn\u2019t generating live.",
    "Saved changes disappear when you refresh the page."];
  var h = '<div class="modal"><div class="box"><div class="mh"><span class="demobar" style="background:none;' +
    'border:0;padding:0"><span class="tag">DEMO</span></span><h3>This is a demonstration</h3></div>' +
    '<div class="mb"><p style="margin:0 0 12px;font-size:14px;line-height:1.6">You\u2019re looking at a working ' +
    'preview of DELCO Social Hub. Click around freely — every screen is live.</p><ul style="margin:0;padding-left:18px">';
  for (var i = 0; i < pts.length; i++) h += '<li>' + pts[i] + '</li>';
  h += '</ul><p class="small muted" style="margin:14px 0 0;line-height:1.6">Prepared by Around SA Marketing ' +
    'for evaluation. Not licensed for business use.</p></div>' +
    '<div class="mf"><button class="btn primary full" data-dismiss="1">Got it — show me the demo</button></div></div></div>';
  return h;
}

function render() {
  try {
    var screen = S[state.view] ? S[state.view]() : S.dashboard();
    var h = '<div class="app">' + sidebar() +
      (state.menu ? '<div class="backdrop" data-closemenu="1"></div>' : '') +
      '<div class="main">' +
      '<div class="demobar"><span class="tag">DEMO</span>' +
      '<span>Sample data only. Not connected to DELCO\u2019s Instagram, Facebook or TikTok — nothing here ' +
      'posts anywhere.</span><span class="v">build 7</span></div>' +
      '<div class="top"><button class="menubtn" data-menu="1">' + ic("menu", 16) + '</button>' +
      '<div class="searchbox">' + ic("search", 14) + '<span>Search content and media</span></div>' +
      '<div style="flex:1"></div>' +
      '<button class="btn dark sm" data-luna="1">' + ic("sparkles", 13) + ' Ask LUNA</button></div>' +
      '<div class="content"><div class="wrap">' + screen +
      '<div class="footnote">Demonstration build · All content, numbers and activity shown are fictional examples.<br>' +
      'Prepared by Around SA Marketing for DELCO Heating &amp; Cooling. Not licensed for business use.</div>' +
      '</div></div></div></div>';
    if (state.panel === "content") { var c = byId(state.panelId); if (c) h += contentPanel(c); }
    if (state.panel === "request") { var r = reqById(state.panelId); if (r) h += requestPanel(r); }
    if (state.panel === "luna") h += lunaPanel();
    if (state.notice) h += demoNotice();
    document.getElementById("app").innerHTML = h;
  } catch (e) {
    var box = document.getElementById("err");
    box.style.display = "block";
    box.textContent = "Something went wrong while drawing the page:\n\n" + (e && e.stack ? e.stack : e);
  }
}

function closePanel() { state.panel = null; state.panelId = null; state.tab = "brief"; }

document.addEventListener("click", function (ev) {
  var el = ev.target, hit = null, keys = ["nav","open","req","act","luna","close","closemenu","menu","tab",
    "pview","aitype","example","generate","lock","libcat","libtag","libclear","range","dismiss","ask","send","stop"];
  while (el && el !== document.body) {
    for (var i = 0; i < keys.length; i++) {
      if (el.hasAttribute && el.hasAttribute("data-" + keys[i])) { hit = [keys[i], el.getAttribute("data-" + keys[i])]; break; }
    }
    if (hit) break;
    el = el.parentNode;
  }
  if (!hit) return;
  var k = hit[0], v = hit[1];
  if (k === "stop") return;
  if (k === "nav") { state.view = v; state.menu = false; closePanel(); window.scrollTo(0, 0); }
  else if (k === "open") { state.panel = "content"; state.panelId = v; state.tab = "brief"; }
  else if (k === "req") { state.panel = "request"; state.panelId = v; }
  else if (k === "act") {
    if (v.charAt(0) === "c") { state.panel = "content"; state.panelId = v; state.tab = "activity"; }
    else { state.panel = "request"; state.panelId = v; }
  }
  else if (k === "luna") { state.panel = "luna"; }
  else if (k === "close") closePanel();
  else if (k === "menu") state.menu = true;
  else if (k === "closemenu") state.menu = false;
  else if (k === "tab") state.tab = v;
  else if (k === "pview") state.plannerView = v;
  else if (k === "aitype") { state.aiType = v; state.aiState = "idle"; }
  else if (k === "example") { state.aiPrompt = v; }
  else if (k === "lock") state.brandLock = !state.brandLock;
  else if (k === "generate") {
    var ta = document.getElementById("aiprompt");
    if (ta) state.aiPrompt = ta.value;
    if (!state.aiPrompt.trim()) state.aiPrompt = "Create a Christmas post for DELCO.";
    state.aiState = "working";
    render();
    setTimeout(function () { generate(); state.aiState = "done"; render(); }, 900);
    return;
  }
  else if (k === "libcat") state.libCat = v;
  else if (k === "libtag") {
    var at = state.libTags.indexOf(v);
    if (at >= 0) state.libTags.splice(at, 1); else state.libTags.push(v);
  }
  else if (k === "libclear") { state.libCat = "All"; state.libTags = []; }
  else if (k === "range") state.range = v;
  else if (k === "dismiss") state.notice = false;
  else if (k === "ask") { state.luna.push({ r: "me", x: v }); state.luna.push({ r: "ai", x: lunaReply(v) }); }
  else if (k === "send") {
    var box = document.getElementById("lunainput");
    var q = box && box.value.trim();
    if (!q) return;
    state.luna.push({ r: "me", x: q });
    state.luna.push({ r: "ai", x: lunaReply(q) });
  }
  render();
});

document.addEventListener("keydown", function (e) {
  if (e.key === "Enter" && e.target && e.target.id === "lunainput") {
    var q = e.target.value.trim();
    if (!q) return;
    state.luna.push({ r: "me", x: q });
    state.luna.push({ r: "ai", x: lunaReply(q) });
    render();
  }
  if (e.key === "Escape") { closePanel(); render(); }
});

window.addEventListener("resize", function () {
  if (state.view === "requests") render();
});

render();
})();
</script>
</body>
</html>
